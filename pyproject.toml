[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajkit"
version = "0.1.0"
description = "Tiny parquet-first toolkit for robot trajectory datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "polars>=1.0",
  "matplotlib>=3.7",
  "h5py",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.34",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
